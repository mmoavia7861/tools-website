name: Check tools-website GitHub Pages build

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run lint
      - name: Run all tool unit tests
        run: npm test
      - name: Build GitHub Pages production assets
        env:
          GITHUB_PAGES: 'true'
        run: |
          cp index.source.html index.html
          npm run build
      - name: Prepare indexable pages and sitemap
        run: node scripts/prepare-pages-seo.mjs
      - name: Create GitHub Pages SPA fallback
        run: cp dist/index.html dist/404.html
      - name: Install browser smoke-test dependencies
        run: |
          npm install --no-save playwright@1.58.2 --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Verify homepage and working tools routing in browser
        run: node scripts/pages-smoke.mjs
