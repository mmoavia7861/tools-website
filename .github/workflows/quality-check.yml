name: ToolsCresta Quality Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript type check
        run: npm run lint
      - name: Unit tests
        run: npm test
      - name: Worker API regression tests
        run: npm run test:api
      - name: Production build
        run: npm run build:production
      - name: Install Chromium for converter smoke tests
        run: npx playwright install --with-deps chromium
      - name: End-to-end free PDF/Word conversion smoke tests
        run: node tests/converter-browser-smoke.mjs
