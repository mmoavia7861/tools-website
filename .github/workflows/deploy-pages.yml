name: Publish tools-website to GitHub Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'index.html'
      - '404.html'
      - 'assets/**'
      - '.nojekyll'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'about/**'
      - 'contact/**'
      - 'privacy-policy/**'
      - 'terms/**'
      - 'acceptable-use/**'
      - 'copyright-dmca/**'
      - 'qr-code-generator/**'
      - 'compress-pdf/**'
      - 'image-to-pdf/**'
      - 'edit-pdf/**'
      - 'background-remover/**'
      - 'visiting-card-generator/**'
      - 'compress-video/**'
      - 'pdf-to-word/**'
      - 'word-to-pdf/**'
      - 'ai-card-generator/**'
      - 'wedding-card-maker/**'
      - 'birthday-card-maker/**'
      - 'admin/**'
      - 'blog/**'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: tools-website-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages_mode: ${{ steps.pages.outputs.mode }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Detect existing Pages publication mode
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PAGES_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/pages")
          MODE=$(printf '%s' "$PAGES_JSON" | jq -r '.build_type // "legacy"')
          DOMAIN=$(printf '%s' "$PAGES_JSON" | jq -r '.cname // ""')
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Pages mode: $MODE; configured domain: ${DOMAIN:-none}"
          if [ -n "$DOMAIN" ]; then
            # A configured custom domain is hosted at /, not /tools-website/.
            echo "site_origin=https://$DOMAIN" >> "$GITHUB_OUTPUT"
            echo "site_base=/" >> "$GITHUB_OUTPUT"
          else
            echo "site_origin=https://${GITHUB_REPOSITORY_OWNER}.github.io" >> "$GITHUB_OUTPUT"
            echo "site_base=/tools-website/" >> "$GITHUB_OUTPUT"
          fi
          if [ "$MODE" != "legacy" ] && [ "$MODE" != "workflow" ]; then
            echo "::error::Unexpected Pages mode: $MODE"
            exit 1
          fi
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build React site and canonical sitemap for configured domain
        env:
          GITHUB_PAGES: 'true'
          TOOLCRESTA_SITE_ORIGIN: ${{ steps.pages.outputs.site_origin }}
          TOOLCRESTA_PAGES_BASE: ${{ steps.pages.outputs.site_base }}
        run: |
          cp index.source.html index.html
          npm run build
          node scripts/prepare-pages-seo.mjs
          node scripts/validate-seo-build.mjs
          test -d dist/assets
          test -f dist/sitemap.xml
          test -f dist/robots.txt
          test -f dist/pdf-to-word/index.html
          test -f dist/word-to-pdf/index.html
          grep -Fq "${TOOLCRESTA_PAGES_BASE}assets/" dist/index.html
          grep -Fq "<loc>https://toolscresta.com/pdf-to-word/</loc>" dist/sitemap.xml
          grep -Fq "<loc>https://toolscresta.com/word-to-pdf/</loc>" dist/sitemap.xml
          grep -Fq "Sitemap: https://toolscresta.com/sitemap.xml" dist/robots.txt
          if grep -Fq '<loc>' dist/sitemap.xml && grep -Fq '/admin/' dist/sitemap.xml; then
            echo "::error::Private admin URL must never be indexed"
            exit 1
          fi
          if grep -q 'src/main.tsx' dist/index.html; then
            echo "::error::Vite generated HTML still references uncompiled TSX"
            exit 1
          fi
      - name: Prepare SPA fallback
        run: |
          grep -Fq 'name="robots" content="noindex, follow"' dist/404.html
          touch dist/.nojekyll
      - name: Publish into existing Pages main/root without changing Settings
        if: steps.pages.outputs.mode == 'legacy'
        run: |
          cp dist/index.html index.html
          cp dist/404.html 404.html
          rm -rf assets
          cp -R dist/assets assets
          cp dist/robots.txt robots.txt
          cp dist/sitemap.xml sitemap.xml
          for route in about contact privacy-policy terms acceptable-use copyright-dmca qr-code-generator compress-pdf image-to-pdf edit-pdf background-remover visiting-card-generator compress-video pdf-to-word word-to-pdf ai-card-generator wedding-card-maker birthday-card-maker admin blog; do
            rm -rf "$route"
            cp -R "dist/$route" "$route"
          done
          touch .nojekyll
          git add index.html 404.html assets robots.txt sitemap.xml .nojekyll about contact privacy-policy terms acceptable-use copyright-dmca qr-code-generator compress-pdf image-to-pdf edit-pdf background-remover visiting-card-generator compress-video pdf-to-word word-to-pdf ai-card-generator wedding-card-maker birthday-card-maker admin blog
          if git diff --cached --quiet; then
            echo 'Production build already present at main/root.'
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'chore(pages): publish compiled React assets to existing branch site'
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      - name: Configure GitHub Pages Action publishing
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/configure-pages@v5
      - name: Upload compiled artifact for GitHub Actions publishing
        if: steps.pages.outputs.mode == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy_from_actions:
    if: needs.build.outputs.pages_mode == 'workflow'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
