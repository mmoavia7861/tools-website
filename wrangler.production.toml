# ToolsCresta production Worker: deploy assets first, attach the domain after validation.
# Domain attachment is intentionally done separately to avoid a failed DNS trigger
# blocking the initial Worker deploy. Do not remove the existing preview Worker.
name = "toolscresta"
main = "./worker/api.mjs"
compatibility_date = "2026-11-14"
workers_dev = true
# Preserve dashboard-configured non-secret runtime variables across Wrangler deployments.
keep_vars = true

# Public/non-secret Adobe OAuth scope configuration.
# Keep this in sync with Cloudflare Dashboard > Runtime variables.
[vars]
ADOBE_OAUTH_SCOPES = "openid,AdobeID,DCAPI,additional_info.projectedProductContext"
# Verified Resend sending address; non-secret, stable across GitHub deploys.
OTP_FROM_EMAIL = "security@toolscresta.com"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# Cloudflare Workers AI (included in Workers Free plan within daily free Neurons).
# The binding has no API key. It is required for AI background generation.
[ai]
binding = "AI"

# Owner-only admin email OTP, stateful one-time codes and strict rate limiting.
# SQLite-backed Durable Objects are available on Cloudflare Workers Free.
[[durable_objects.bindings]]
name = "ADMIN_OTP"
class_name = "AdminOtpState"

[[migrations]]
tag = "toolscresta-admin-otp-v1"
new_sqlite_classes = ["AdminOtpState"]

# These values are RUNTIME SECRETS and must never enter git or [vars]:
#   RESEND_API_KEY, OTP_HASH_SECRET,
#   FIREBASE_SERVICE_ACCOUNT_EMAIL, FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY
# Non-secret runtime variable (from an email address on a verified sending domain):
#   OTP_FROM_EMAIL = security@toolscresta.com
