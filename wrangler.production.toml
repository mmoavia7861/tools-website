# ToolsCresta production Worker: deploy assets first, attach the domain after validation.
# Domain attachment is intentionally done separately to avoid a failed DNS trigger
# blocking the initial Worker deploy. Do not remove the existing preview Worker.
name = "toolscresta"
main = "./worker/api.mjs"
compatibility_date = "2026-11-14"
workers_dev = true
# Preserve dashboard-configured non-secret runtime variables across Wrangler deployments.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
