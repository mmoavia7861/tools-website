# ToolsCresta production Worker: deploy assets first, attach the domain after validation.
# Domain attachment is intentionally done separately to avoid a failed DNS trigger
# blocking the initial Worker deploy. Do not remove the existing preview Worker.
name = "toolscresta"
compatibility_date = "2026-11-14"
workers_dev = true

[assets]
directory = "./dist"
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"
