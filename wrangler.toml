# Cloudflare preview Worker for the ToolsCresta static React website.
# The production custom domain remains on GitHub Pages until separately tested.
name = "toolcresta-preview"
compatibility_date = "2026-11-14"
workers_dev = true
main = "./worker/api.mjs"
# Keep configured secret and non-secret settings on redeploy.
keep_vars = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
html_handling = "auto-trailing-slash"

# Free Workers AI binding for wedding, birthday and visiting-card backgrounds.
[ai]
binding = "AI"
